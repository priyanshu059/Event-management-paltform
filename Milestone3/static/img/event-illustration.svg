<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="300" cy="250" r="230" fill="url(#bgGrad)" opacity="0.12"/>
  <circle cx="300" cy="250" r="180" fill="url(#bgGrad)" opacity="0.08"/>

  <!-- Main event card -->
  <rect x="100" y="120" width="400" height="260" rx="24" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="100" y="120" width="400" height="260" rx="24" fill="url(#cardGrad)"/>

  <!-- Card header bar -->
  <rect x="100" y="120" width="400" height="60" rx="24" fill="#7c3aed" opacity="0.6"/>
  <rect x="100" y="156" width="400" height="24" fill="#7c3aed" opacity="0.6"/>

  <!-- Calendar icon -->
  <rect x="130" y="135" width="36" height="32" rx="6" fill="white" opacity="0.9"/>
  <rect x="130" y="135" width="36" height="12" rx="6" fill="#7c3aed"/>
  <rect x="130" y="141" width="36" height="6" fill="#7c3aed"/>
  <!-- Calendar lines -->
  <line x1="140" y1="157" x2="140" y2="160" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="148" y1="157" x2="148" y2="160" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="156" y1="157" x2="156" y2="160" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="162" x2="140" y2="165" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="148" y1="162" x2="148" y2="165" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>

  <!-- Event title text lines -->
  <rect x="180" y="138" width="180" height="10" rx="5" fill="white" opacity="0.9"/>
  <rect x="180" y="154" width="120" height="8" rx="4" fill="white" opacity="0.5"/>

  <!-- Location pin -->
  <circle cx="390" cy="143" r="10" fill="white" opacity="0.9"/>
  <polygon points="390,158 384,143 396,143" fill="white" opacity="0.9"/>
  <circle cx="390" cy="143" r="4" fill="#7c3aed"/>

  <!-- Attendee avatars row -->
  <circle cx="145" cy="215" r="22" fill="#f59e0b"/>
  <text x="145" y="220" text-anchor="middle" font-size="16" font-family="Arial" fill="white">👤</text>

  <circle cx="185" cy="215" r="22" fill="#10b981"/>
  <text x="185" y="220" text-anchor="middle" font-size="16" font-family="Arial" fill="white">👤</text>

  <circle cx="225" cy="215" r="22" fill="#ef4444"/>
  <text x="225" y="220" text-anchor="middle" font-size="16" font-family="Arial" fill="white">👤</text>

  <circle cx="265" cy="215" r="22" fill="#8b5cf6"/>
  <text x="265" y="220" text-anchor="middle" font-size="16" font-family="Arial" fill="white">👤</text>

  <!-- +N more badge -->
  <circle cx="305" cy="215" r="22" fill="white" opacity="0.2"/>
  <text x="305" y="221" text-anchor="middle" font-size="13" font-family="Arial" fill="white" font-weight="bold">+24</text>

  <!-- Attendees label -->
  <rect x="340" y="205" width="140" height="20" rx="10" fill="white" opacity="0.15"/>
  <text x="410" y="219" text-anchor="middle" font-size="11" font-family="Arial" fill="white" opacity="0.9">247 Registered</text>

  <!-- Ticket strip -->
  <rect x="120" y="255" width="360" height="60" rx="12" fill="url(#ticketGrad)" opacity="0.9"/>
  <!-- Ticket notches -->
  <circle cx="120" cy="285" r="10" fill="#1e1b4b"/>
  <circle cx="480" cy="285" r="10" fill="#1e1b4b"/>
  <!-- Ticket dashed line -->
  <line x1="175" y1="285" x2="425" y2="285" stroke="white" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- Ticket text -->
  <text x="180" y="277" font-size="13" font-family="Arial" fill="white" font-weight="bold">TICKET</text>
  <text x="180" y="294" font-size="10" font-family="Arial" fill="white" opacity="0.8">VIP · Row A · Seat 12</text>
  <!-- Ticket barcode lines -->
  <rect x="390" y="263" width="3" height="44" rx="1" fill="white" opacity="0.8"/>
  <rect x="396" y="263" width="2" height="44" rx="1" fill="white" opacity="0.8"/>
  <rect x="401" y="263" width="4" height="44" rx="1" fill="white" opacity="0.8"/>
  <rect x="408" y="263" width="2" height="44" rx="1" fill="white" opacity="0.8"/>
  <rect x="413" y="263" width="3" height="44" rx="1" fill="white" opacity="0.8"/>
  <rect x="419" y="263" width="2" height="44" rx="1" fill="white" opacity="0.8"/>

  <!-- Stats bar at bottom -->
  <rect x="120" y="330" width="100" height="34" rx="10" fill="white" opacity="0.12"/>
  <text x="170" y="348" text-anchor="middle" font-size="11" font-family="Arial" fill="white">📅 3 Events</text>

  <rect x="235" y="330" width="130" height="34" rx="10" fill="white" opacity="0.12"/>
  <text x="300" y="348" text-anchor="middle" font-size="11" font-family="Arial" fill="white">🎤 12 Speakers</text>

  <rect x="380" y="330" width="100" height="34" rx="10" fill="white" opacity="0.12"/>
  <text x="430" y="348" text-anchor="middle" font-size="11" font-family="Arial" fill="white">⭐ 4.9 Rating</text>

  <!-- Floating decorative elements -->
  <circle cx="65" cy="160" r="18" fill="#f59e0b" opacity="0.7"/>
  <circle cx="65" cy="160" r="10" fill="#f59e0b"/>
  <text x="65" y="165" text-anchor="middle" font-size="12" font-family="Arial" fill="white">🎉</text>

  <circle cx="535" cy="200" r="14" fill="#10b981" opacity="0.7"/>
  <circle cx="535" cy="200" r="8" fill="#10b981"/>
  <text x="535" y="205" text-anchor="middle" font-size="10" font-family="Arial" fill="white">✓</text>

  <circle cx="80" cy="350" r="12" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="520" cy="350" r="16" fill="#ef4444" opacity="0.5"/>

  <!-- Star decorations -->
  <text x="50" y="280" font-size="20" font-family="Arial" fill="#f59e0b" opacity="0.6">★</text>
  <text x="540" y="320" font-size="14" font-family="Arial" fill="#7c3aed" opacity="0.7">★</text>
  <text x="520" y="130" font-size="18" font-family="Arial" fill="#10b981" opacity="0.5">✦</text>
  <text x="60" y="420" font-size="16" font-family="Arial" fill="#2563eb" opacity="0.5">✦</text>
</svg>
